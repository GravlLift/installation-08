# Ported from LevelUp's config/titles/halo_infinite/mappings/weapon_names.toml
# (apps/go-api of P:\software\LevelUp, worktree replay-3d, branch integration).
#
# Hand-written title mapping: the display names of the weapons the title knows, keyed by
# weapon_key. Only the keys that the filmshell family table (weapon_families.toml) names
# are listed; the keys the title maps but the film never writes (vehicles, turrets, coils
# that only die, the repulsor) would reach the replay document through no other path.

