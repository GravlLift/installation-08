# Ported from LevelUp's weapon registry, the weaponRegistryWeapons rows
# (apps/go-api/internal/games/weapons/registry.go, worktree replay-3d, branch integration),
# limited to the weapon_keys the filmshell family table names.
#
# Hand-written mapping of weapon_key to combat role, from the canonical cross-title weapon
# registry (internal/games/weapons, never a title mapping file). The role of a key the table
# does not name is the empty string: a weapon the registry does not classify keeps no role
# and borrows none from a neighbour.

[roles]
hinf_br75 = "precision"
hinf_bandit = "precision"
hinf_ma40_ar = "automatic"
hinf_ma5k_avenger = "automatic"
hinf_vk78_commando = "automatic"
hinf_s7_sniper = "sniper"
