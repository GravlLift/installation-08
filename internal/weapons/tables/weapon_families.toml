# Ported in full from LevelUp's weapon registry, the table weaponRegistryInfiniteFilmshell in
# apps/go-api/internal/games/weapons/registry.go (worktree replay-3d, branch integration):
# every entry the registry gives LevelUp's cat.Keys (FilmshellWeaponKeysByFamily, one line
# per family, first id per key) and nothing else.
#
# Hand-written mapping of a weapon family (the high 32 bits of the film's 64-bit weapon id)
# to the title's canonical weapon_key: the join that lets a decoded shot name the weapon
# that fired it.

